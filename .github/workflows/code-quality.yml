name: Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    name: Clang-Tidy Analysis
    
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt-get install -y cmake clang-20 clang-tidy-20
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-20 100

    - name: Configure CMake
      run: |
        mkdir -p build.analysis
        cd build.analysis
        cmake .. -DCMAKE_BUILD_TYPE=Debug \
                 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy on core library
      run: |
        cd build.analysis
        clang-tidy ../container/btree_map.hpp \
          -p . \
          --checks='-*,readability-*,performance-*,modernize-*,bugprone-*' \
          --warnings-as-errors=false

    - name: Run clang-tidy on tests
      run: |
        cd build.analysis
        clang-tidy ../tests/btree_map_test.cc \
          -p . \
          --checks='-*,readability-*,performance-*,modernize-*,bugprone-*' \
          --warnings-as-errors=false


  format-check:
    runs-on: ubuntu-latest
    name: Format Check

    steps:
    - uses: actions/checkout@v7

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    - name: Check formatting (advisory only)
      run: |
        clang-format --version
        echo "Note: Format check is advisory only due to version differences"
        find . -name "*.hpp" -o -name "*.cc" -o -name "*.cpp" -o -name "*.h" | \
        grep -v -E "(doctest|nanobench|build\.|third_party|external)" | \
        xargs clang-format --dry-run --style=file || true

  # This job existed and was green, and like the rest of CI it was green on nothing: `cmake --build .`
  # skips EXCLUDE_FROM_ALL targets, so the sanitizers were never pointed at a single test. Had they
  # been, ASan alone would have handed over the btree_multimap SIGSEGV (heap-buffer-overflow reading a
  # leaf past its keys) and the dense_map use-after-free (hashing string_views into a reallocated
  # vector), and TSan the skiplist's concurrent-erase double-claim.
  sanitizers:
    name: Sanitizer / ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: address,undefined
            env: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          - san: thread
            env: TSAN_OPTIONS=halt_on_error=1

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # clang for the sanitizers, and build-essential for the standard library they run against: Ubuntu's
    # clang package ships no C++ standard library headers of its own, so dropping libc++ without adding
    # libstdc++ leaves it unable to find <algorithm> at all.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang build-essential

    # libstdc++, not libc++, and with every check left on rather than any of them suppressed.
    #
    # Ubuntu's libc++ ships as an uninstrumented shared library, and ASan reports an
    # alloc-dealloc-mismatch inside std::logic_error's message storage the moment anything throws --
    # art_map_test.cc:66 is just `CHECK_THROWS_AS(m.at(99), std::out_of_range)`, which is as ordinary as
    # code gets. The mismatch is in libc++.so, a library we neither build nor ship; our frame in that
    # stack does nothing but throw a standard exception.
    #
    # The alternative was ASAN_OPTIONS=alloc_dealloc_mismatch=0, and it is the wrong trade: it would
    # disable that check for *our* code too, so a genuine new/free mismatch in a container would go
    # unseen. Better to point the sanitizers at a standard library they can actually instrument and keep
    # every check armed. The libc++ compile-and-run path is still covered, by the build-and-test matrix.
    - name: Configure
      run: |
        cmake -S . -B build.sanitizer \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="-g -fsanitize=${{ matrix.san }} -fno-omit-frame-pointer"

    - name: Build tests
      run: cmake --build build.sanitizer --target containa_test -j$(nproc)

    - name: Run tests
      run: |
        ${{ matrix.env }} ctest --test-dir build.sanitizer --no-tests=error --output-on-failure