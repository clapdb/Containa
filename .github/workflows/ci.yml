name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Every job here ends in `ctest --no-tests=error`. That flag is not decoration: this project's CI was
# green for its whole life while running zero tests. `containa_test` is EXCLUDE_FROM_ALL, so
# `cmake --build .` never compiled it, and nothing ever called add_test(), so `ctest` printed
# "No tests were found!!!" and exited 0 -- which CI read as a pass. Five real bugs, one of them
# producing wrong query results downstream, sat behind that. --no-tests=error turns an empty test list
# back into a failure, so this cannot quietly happen again.

jobs:
  # The two standard libraries are not redundant. Each hid a missing include the other tolerated:
  # <cstdlib> for std::abort in dense_map (libstdc++ drags it in, libc++ does not), and <array> in
  # devectra_test (libc++ drags it in, libstdc++ does not). Whichever one you build with, the suite
  # fails to compile -- just in a different file, which is how fixing one and watching the build get
  # further led to the conclusion that the other did not exist.
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC / libstdc++ / Debug
            cxx: g++
            build_type: Debug
            cxx_flags: ""
            apt: build-essential
          - name: GCC / libstdc++ / Release
            cxx: g++
            build_type: Release
            cxx_flags: ""
            apt: build-essential
          - name: Clang / libc++ / Debug
            cxx: clang++
            build_type: Debug
            cxx_flags: "-stdlib=libc++"
            apt: clang libc++-dev libc++abi-dev
          - name: Clang / libc++ / Release
            cxx: clang++
            build_type: Release
            cxx_flags: "-stdlib=libc++"
            apt: clang libc++-dev libc++abi-dev

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ${{ matrix.apt }}

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

    # By name, explicitly. containa_test is EXCLUDE_FROM_ALL so that a project vendoring us through
    # add_subdirectory() does not have to build our tests -- which also means `cmake --build .` skips
    # it, which is exactly how it went this long without ever being compiled.
    - name: Build tests
      run: cmake --build build --target containa_test -j$(nproc)

    - name: Build library and benchmarks
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --no-tests=error --output-on-failure

  # The two SIMD bugs hide from each other across this boundary, so a single -march is not enough:
  #
  #   * bitmap::popcount() dispatches AVX512-VPOPCNT -> AVX2 -> NEON -> scalar. There is no SSE path,
  #     so a baseline build falls through to scalar and is correct, while the AVX2 path returned
  #     *zero* for a fully set bitmap of 128 words or more. Baseline-only CI is structurally blind to
  #     it.
  #   * boolean_vector::count() is the other way round: its 8-bit lanes wrap after 256 iterations, so
  #     the SSE path (16 bytes/iteration) breaks from 4096 elements while AVX2 (32 bytes) holds out to
  #     8192 -- and at the density the old tests used, an AVX2 lane never reached the wrap at all.
  #
  # Pin both explicitly rather than trusting whatever -march=native happens to give the runner.
  simd-paths:
    name: SIMD / ${{ matrix.march }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        march: [x86-64-v2, x86-64-v3]   # v2 = SSE4.2, no AVX2 (scalar popcount); v3 = AVX2

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang libc++-dev libc++abi-dev

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -march=${{ matrix.march }}"

    - name: Build tests
      run: cmake --build build --target containa_test -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --no-tests=error --output-on-failure
